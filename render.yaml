services:
  - type: web
    name: tomasz-trading-journal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JOURNAL_KEY
        generateValue: true
      - key: STORAGE_BUCKET
        value: trade-screenshots
